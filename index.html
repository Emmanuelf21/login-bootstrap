<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Formulário de login</title>
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <!--py-4 = padding em y -->
    <main class="w-100 m-auto form-container">
        <!-- width: 100% margin: auto-->
        <form>
            <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" class="mb-4" height="57"
                width="72" />
            <!--margin-bottom-->
            <h1 class="h3 fw-normal mb-3">Please sign in</h1>
            <!--font-weight-->
            <div class="form-floating">
                <input type="text" class="form-control" id="floatingInput" placeholder="your-email@gmail.com"/>
                <label for="floatingInput">Email address</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingInput" placeholder="password"/>
                <label for="floatingInput">Password</label>
            </div>
            <div class="form-check text-start my-3">
                <input type="checkbox" class="form-check-input" id="flexCheckDefault"/>
                <label class="form-check-label" for="flexCheckDefault">Remember me</label>
            </div>
            <button class="btn btn-primary w-100 py-2">Sign in</button>
            <p class="text-body-secondary mt-5 mb-13">&copy; 2007-2023</p>
        </form>
    </main>
</body>

</html>
